<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketFlow | Recuperar Senha</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(255,255,255,0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .recovery-container {
            max-width: 480px;
            width: 100%;
            background: white;
            border-radius: 2rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .recovery-header {
            background: linear-gradient(135deg, #f97316, #facc15);
            padding: 2rem;
            text-align: center;
            color: white;
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .recovery-header h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .recovery-header p {
            opacity: 0.9;
            font-size: 0.9rem;
        }

        .recovery-form {
            padding: 2rem;
        }

        .step-indicator {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2rem;
            position: relative;
        }

        .step {
            flex: 1;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .step-number {
            width: 40px;
            height: 40px;
            background: var(--gray-200);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--gray-600);
            transition: all 0.3s;
            margin-bottom: 0.5rem;
        }

        .step.active .step-number {
            background: #f97316;
            color: white;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
        }

        .step.completed .step-number {
            background: #10b981;
            color: white;
        }

        .step.completed .step-number i {
            font-size: 1rem;
        }

        .step-label {
            font-size: 0.75rem;
            color: var(--gray-500);
        }

        .step.active .step-label {
            color: #f97316;
            font-weight: 600;
        }

        .progress-line {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--gray-200);
            z-index: 0;
        }

        .progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: #f97316;
            transition: width 0.3s ease;
            width: 0%;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            color: #1e293b;
        }

        .form-group input {
            width: 100%;
            padding: 0.9rem 1rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 1rem;
            font-size: 0.95rem;
            transition: all 0.2s;
            outline: none;
        }

        .form-group input:focus {
            border-color: #f97316;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1);
        }

        .btn {
            width: 100%;
            padding: 0.9rem;
            border-radius: 3rem;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(249, 115, 22, 0.3);
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #1e293b;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
            transform: translateY(-2px);
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: #f97316;
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .message-area {
            background: #f8fafc;
            border-radius: 1rem;
            padding: 0.75rem;
            margin-bottom: 1.5rem;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .message-success {
            background: #e6f7e6;
            color: #2e7d32;
        }

        .message-error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .message-info {
            background: #e6f0ff;
            color: #1e40af;
        }

        .hidden {
            display: none;
        }

        .code-inputs {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            margin: 1rem 0;
        }

        .code-input {
            width: 50px;
            height: 60px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            border: 2px solid #e2e8f0;
            border-radius: 0.75rem;
            outline: none;
        }

        .code-input:focus {
            border-color: #f97316;
        }

        footer {
            background: #f8fafc;
            padding: 1rem;
            text-align: center;
            font-size: 0.7rem;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="recovery-container">
    <div class="recovery-header">
        <div class="logo">
            <i class="fas fa-store"></i> MarketFlow
        </div>
        <h2>Recuperar Senha</h2>
        <p>Digite seu e-mail para receber um código de verificação</p>
    </div>

    <div class="recovery-form">
        <!-- Indicador de etapas -->
        <div class="step-indicator">
            <div class="step active" id="step1">
                <div class="step-number">1</div>
                <div class="step-label">Identificação</div>
            </div>
            <div class="step" id="step2">
                <div class="step-number">2</div>
                <div class="step-label">Verificação</div>
            </div>
            <div class="step" id="step3">
                <div class="step-number">3</div>
                <div class="step-label">Nova Senha</div>
            </div>
            <div class="progress-line">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <!-- Área de mensagens -->
        <div id="messageBox" class="message-area hidden"></div>

        <!-- ETAPA 1: Solicitar e-mail/usuário -->
        <div id="step1Content">
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> E-mail ou Usuário</label>
                <input type="text" id="userIdentifier" placeholder="Digite seu e-mail ou nome de usuário" autocomplete="off">
            </div>
            <button class="btn btn-primary" id="requestCodeBtn">
                <i class="fas fa-paper-plane"></i> Enviar Código
            </button>
        </div>

        <!-- ETAPA 2: Verificar código -->
        <div id="step2Content" class="hidden">
            <div class="form-group">
                <label><i class="fas fa-key"></i> Código de Verificação</label>
                <div class="code-inputs" id="codeInputs">
                    <input type="text" maxlength="1" class="code-input" id="code1" autocomplete="off">
                    <input type="text" maxlength="1" class="code-input" id="code2" autocomplete="off">
                    <input type="text" maxlength="1" class="code-input" id="code3" autocomplete="off">
                    <input type="text" maxlength="1" class="code-input" id="code4" autocomplete="off">
                    <input type="text" maxlength="1" class="code-input" id="code5" autocomplete="off">
                    <input type="text" maxlength="1" class="code-input" id="code6" autocomplete="off">
                </div>
                <p style="font-size: 0.75rem; color: #64748b; text-align: center; margin-top: 0.5rem;">
                    <i class="fas fa-info-circle"></i> Um código foi enviado para seu e-mail (simulação)
                </p>
            </div>
            <button class="btn btn-primary" id="verifyCodeBtn">
                <i class="fas fa-check-circle"></i> Verificar Código
            </button>
            <button class="btn btn-secondary" id="resendCodeBtn" style="margin-top: 0.5rem;">
                <i class="fas fa-redo"></i> Reenviar Código
            </button>
        </div>

        <!-- ETAPA 3: Nova senha -->
        <div id="step3Content" class="hidden">
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Nova Senha</label>
                <input type="password" id="newPassword" placeholder="Digite sua nova senha" autocomplete="off">
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Confirmar Nova Senha</label>
                <input type="password" id="confirmPassword" placeholder="Confirme sua nova senha" autocomplete="off">
            </div>
            <div id="passwordStrength" class="message-area hidden"></div>
            <button class="btn btn-primary" id="resetPasswordBtn">
                <i class="fas fa-save"></i> Redefinir Senha
            </button>
        </div>

        <div class="back-link">
            <a href="login.html">
                <i class="fas fa-arrow-left"></i> Voltar para o login
            </a>
        </div>
    </div>

    <footer>
        <i class="fas fa-shield-alt"></i> Ambiente seguro | Código de verificação simulado
    </footer>
</div>

<script>
    const API_URL = "http://127.0.0.1:5000";
    let currentStep = 1;
    let verificationCode = null;
    let verifiedUser = null;
    let resendTimer = null;
    let timeLeft = 0;

    // Elementos
    const step1Content = document.getElementById("step1Content");
    const step2Content = document.getElementById("step2Content");
    const step3Content = document.getElementById("step3Content");
    const messageBox = document.getElementById("messageBox");
    const progressFill = document.getElementById("progressFill");

    function showMessage(text, type) {
        messageBox.textContent = text;
        messageBox.className = "message-area";
        if (type === "success") messageBox.classList.add("message-success");
        else if (type === "error") messageBox.classList.add("message-error");
        else messageBox.classList.add("message-info");
        messageBox.classList.remove("hidden");
        
        setTimeout(() => {
            messageBox.classList.add("hidden");
        }, 5000);
    }

    function updateStep(step) {
        currentStep = step;
        
        // Ocultar todos os conteúdos
        step1Content.classList.add("hidden");
        step2Content.classList.add("hidden");
        step3Content.classList.add("hidden");
        
        // Mostrar conteúdo atual
        if (step === 1) step1Content.classList.remove("hidden");
        else if (step === 2) step2Content.classList.remove("hidden");
        else if (step === 3) step3Content.classList.remove("hidden");
        
        // Atualizar indicadores
        const steps = [1, 2, 3];
        steps.forEach(s => {
            const stepElement = document.getElementById(`step${s}`);
            if (s < step) {
                stepElement.classList.add("completed");
                stepElement.classList.remove("active");
                stepElement.querySelector(".step-number").innerHTML = '<i class="fas fa-check"></i>';
            } else if (s === step) {
                stepElement.classList.add("active");
                stepElement.classList.remove("completed");
                stepElement.querySelector(".step-number").innerHTML = s;
            } else {
                stepElement.classList.remove("active", "completed");
                stepElement.querySelector(".step-number").innerHTML = s;
            }
        });
        
        // Atualizar barra de progresso
        const progress = ((step - 1) / 2) * 100;
        progressFill.style.width = `${progress}%`;
    }

    // Gerar código aleatório de 6 dígitos
    function generateCode() {
        return Math.floor(100000 + Math.random() * 900000).toString();
    }

    // Simular envio de código por e-mail
    function sendCode(email) {
        verificationCode = generateCode();
        console.log(`[SIMULAÇÃO] Código enviado para ${email}: ${verificationCode}`);
        
        showMessage(`📧 Código de verificação enviado para ${email}! (Simulação: ${verificationCode})`, "success");
        
        // Iniciar timer para reenvio (30 segundos)
        if (resendTimer) clearInterval(resendTimer);
        timeLeft = 30;
        const resendBtn = document.getElementById("resendCodeBtn");
        resendBtn.disabled = true;
        resendBtn.innerHTML = `<i class="fas fa-clock"></i> Reenviar em ${timeLeft}s`;
        
        resendTimer = setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) {
                clearInterval(resendTimer);
                resendBtn.disabled = false;
                resendBtn.innerHTML = '<i class="fas fa-redo"></i> Reenviar Código';
            } else {
                resendBtn.innerHTML = `<i class="fas fa-clock"></i> Reenviar em ${timeLeft}s`;
            }
        }, 1000);
        
        return true;
    }

    // Buscar usuário no backend
    async function findUser(identifier) {
        try {
            // Primeiro, tentar buscar usuários (usando endpoint de produtos para verificar se existe)
            const response = await fetch(`${API_URL}/products`);
            if (!response.ok) return null;
            
            // Como não temos endpoint específico, vamos usar uma simulação
            // Para simplificar, aceitamos admin, demo ou qualquer usuário que exista no banco
            const knownUsers = ["admin", "demo"];
            if (knownUsers.includes(identifier.toLowerCase()) || identifier.includes("@")) {
                return { username: identifier.toLowerCase().replace("@", "").split("@")[0] || "admin" };
            }
            return null;
        } catch (error) {
            console.error("Erro ao buscar usuário:", error);
            return null;
        }
    }

    // Solicitar código
    document.getElementById("requestCodeBtn").addEventListener("click", async () => {
        const identifier = document.getElementById("userIdentifier").value.trim();
        
        if (!identifier) {
            showMessage("Por favor, digite seu e-mail ou nome de usuário", "error");
            return;
        }
        
        // Simular busca de usuário
        const user = await findUser(identifier);
        
        if (!user && identifier !== "admin" && identifier !== "demo" && !identifier.includes("@")) {
            showMessage("Usuário não encontrado. Verifique se o nome está correto.", "error");
            return;
        }
        
        const email = identifier.includes("@") ? identifier : `${identifier}@marketflow.com`;
        verifiedUser = identifier.includes("@") ? identifier.split("@")[0] : identifier;
        
        sendCode(email);
        updateStep(2);
        
        // Limpar campos de código
        for (let i = 1; i <= 6; i++) {
            document.getElementById(`code${i}`).value = "";
        }
        
        // Focar no primeiro campo
        document.getElementById("code1").focus();
    });

    // Auto-focus entre campos de código
    const codeInputs = document.querySelectorAll('.code-input');
    codeInputs.forEach((input, index) => {
        input.addEventListener('keyup', (e) => {
            if (e.target.value.length === 1 && index < 5) {
                codeInputs[index + 1].focus();
            } else if (e.key === 'Backspace' && !e.target.value && index > 0) {
                codeInputs[index - 1].focus();
            }
        });
    });

    // Verificar código
    document.getElementById("verifyCodeBtn").addEventListener("click", () => {
        let code = "";
        for (let i = 1; i <= 6; i++) {
            code += document.getElementById(`code${i}`).value;
        }
        
        if (code.length !== 6) {
            showMessage("Por favor, digite o código completo de 6 dígitos", "error");
            return;
        }
        
        if (code === verificationCode) {
            showMessage("✅ Código verificado com sucesso! Agora defina sua nova senha.", "success");
            updateStep(3);
        } else {
            showMessage("❌ Código inválido. Verifique e tente novamente.", "error");
        }
    });

    // Reenviar código
    document.getElementById("resendCodeBtn").addEventListener("click", () => {
        if (timeLeft > 0) {
            showMessage(`Aguarde ${timeLeft} segundos para reenviar o código`, "info");
            return;
        }
        
        const email = verifiedUser ? `${verifiedUser}@marketflow.com` : "usuario@marketflow.com";
        sendCode(email);
    });

    // Verificar força da senha
    function checkPasswordStrength(password) {
        let strength = 0;
        if (password.length >= 6) strength++;
        if (password.length >= 10) strength++;
        if (/[A-Z]/.test(password)) strength++;
        if (/[0-9]/.test(password)) strength++;
        if (/[^A-Za-z0-9]/.test(password)) strength++;
        
        const strengthText = document.getElementById("passwordStrength");
        if (password.length === 0) {
            strengthText.classList.add("hidden");
            return;
        }
        
        strengthText.classList.remove("hidden", "message-success", "message-error", "message-info");
        
        if (strength <= 2) {
            strengthText.className = "message-area message-error";
            strengthText.innerHTML = "<i class='fas fa-exclamation-triangle'></i> Senha fraca - Use pelo menos 6 caracteres";
        } else if (strength <= 4) {
            strengthText.className = "message-area message-info";
            strengthText.innerHTML = "<i class='fas fa-info-circle'></i> Senha média - Adicione números e símbolos";
        } else {
            strengthText.className = "message-area message-success";
            strengthText.innerHTML = "<i class='fas fa-check-circle'></i> Senha forte!";
        }
    }

    document.getElementById("newPassword").addEventListener("input", (e) => {
        checkPasswordStrength(e.target.value);
    });

    // Redefinir senha
    document.getElementById("resetPasswordBtn").addEventListener("click", async () => {
        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        
        if (!newPassword || !confirmPassword) {
            showMessage("Por favor, preencha ambos os campos", "error");
            return;
        }
        
        if (newPassword.length < 4) {
            showMessage("A senha deve ter pelo menos 4 caracteres", "error");
            return;
        }
        
        if (newPassword !== confirmPassword) {
            showMessage("As senhas não coincidem", "error");
            return;
        }
        
        // Simular atualização de senha no backend
        try {
            // Como não temos endpoint de atualização de senha, vamos simular
            // Em produção, você faria uma requisição PUT/PATCH para /user/password
            
            showMessage("🔄 Atualizando sua senha...", "info");
            
            // Simular delay de rede
            await new Promise(resolve => setTimeout(resolve, 1500));
            
            showMessage("✅ Senha redefinida com sucesso! Você já pode fazer login com sua nova senha.", "success");
            
            // Redirecionar para o login após 2 segundos
            setTimeout(() => {
                window.location.href = "login.html";
            }, 2000);
            
        } catch (error) {
            showMessage("Erro ao redefinir senha. Tente novamente.", "error");
        }
    });

    // Inicializar
    updateStep(1);
</script>
</body>
</html>
